id: sidekiq_sidekiq_rx
label: Sidekiq RX Source
flags: hardware
category: '[sidekiq]'

templates:
  imports: from gnuradio import sidekiq
  make: sidekiq.sidekiq_rx(${card}, ${topology}, ${handle1}, ${frequency}, ${handle2}, ${frequency2}, ${handle3}, ${frequency3}, ${handle4}, ${frequency4}, ${sample_rate}, ${bandwidth}, ${gain_mode}, ${gain_index}, ${timestamp_tags}, ${trigger_src}, ${pps_source}, ${cal_mode}, ${cal_type})
  callbacks:
  - set_rx_sample_rate(${sample_rate})
  - set_rx_bandwidth(${bandwidth})
  - set_rx_frequency_for_hdl(${handle1}, ${frequency})
  - set_rx_frequency_for_hdl(${handle2}, ${frequency2})
  - set_rx_frequency_for_hdl(${handle3}, ${frequency3})
  - set_rx_frequency_for_hdl(${handle4}, ${frequency4})
  - set_rx_gain_mode(${gain_mode})
  - set_rx_gain_index(${gain_index})
  - set_rx_cal_mode(${cal_mode})
  - set_rx_cal_type(${cal_type})
  - run_rx_cal(${run_cal})


#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: card
  label: Card
  dtype: int
  default: 0

- id: topology
  label: Topology
  dtype: int
  default: -1

- id: handle1
  label: Handle Id1
  dtype: enum
  options: ['0', '1', '2', '3', '4', '5']
  option_labels: ['RxA1', 'RxA2', 'RxB1', 'RxB2', 'RxC1', 'RxD1']
  default: 0

- id: handle2
  label: Handle Id2
  dtype: enum
  options: ['100', '0', '1', '2', '3', '4', '5']
  option_labels: ['None', 'RxA1', 'RxA2', 'RxB1', 'RxB2', 'RxC1', 'RxD1']
  default: 100

- id: handle3
  label: Handle Id3
  dtype: enum
  options: ['100', '0', '1', '2', '3', '4', '5']
  option_labels: ['None', 'RxA1', 'RxA2', 'RxB1', 'RxB2', 'RxC1', 'RxD1']
  default: 100

- id: handle4
  label: Handle Id4
  dtype: enum
  options: ['100', '0', '1', '2', '3', '4', '5']
  option_labels: ['None', 'RxA1', 'RxA2', 'RxB1', 'RxB2', 'RxC1', 'RxD1']
  default: 100

- id: sample_rate
  label: Sample Rate
  dtype: real
  default: 20e6

- id: bandwidth
  label: Bandwidth
  default: 1e6
  dtype: real
  default: 18e6

- id: frequency
  label: Frequency 1
  dtype: real
  default: 1000e6

- id: frequency2
  label: Frequency 2
  dtype: real
  default: 1000e6
  hide: ${ 'all' if handle2 == '100' else 'none' }

- id: frequency3
  label: Frequency 3
  dtype: real
  default: 1000e6
  hide: ${ 'all' if handle3 == '100' else 'none' }

- id: frequency4
  label: Frequency 4
  dtype: real
  default: 1000e6
  hide: ${ 'all' if handle4 == '100' else 'none' }

- id: gain_mode
  label: Gain Mode
  dtype: enum
  options: ['0', '1']
  option_labels: ['Manual', 'Auto']
  default: 1

- id: gain_index
  label: Gain Index
  hide: ${ ('all' if (gain_mode == '1') else 'part') }
  dtype: int
  default: 1

- id: timestamp_tags
  label: Timestamp Tags 
  dtype: enum
  options: ['0', '1']
  option_labels: ['Disabled', 'Enabled']
  default: 0

- id: trigger_src
  label: Streaming Trigger
  dtype: enum
  options: ['0', '1', '2']
  option_labels: ['Immediate', '1pps', 'Synced']
  default: 0

- id: pps_source
  label: 1PPS Source
  dtype: enum
  options: ['0', '1']
  option_labels: ['Host', 'External']
  default: 0

- id: cal_mode
  label: Calibration Mode
  dtype: enum
  options: ['0', '1', '2']
  option_labels: ['Auto', 'Manual', 'Off']
  default: 0

- id: cal_type
  label: Calibration Type
  dtype: enum
  options: ['0', '1', '2']
  option_labels: ['DC offset', 'Quadrature', 'Both']
  default: 0

- id: run_cal
  label: Run Cal 
  hide: ${ ('all' if (cal_mode == '0') else 'part') }
  dtype: int
  default: 0

  
#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: command
  domain: message
  dtype: float
  optional: true
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...

outputs:

- label: Samples
  domain: stream
  dtype: complex
  multiplicity: ${ 1 + (handle2 != '100') + (handle3 != '100') + (handle4 != '100') }
  optional: false

#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...

documentation: |-
    A Source Block for Epiq Sidekiq SDRs.

    Block features:
        Handles - One to four distinct RX handles can be selected. Each selected
        handle has its own frequency and output, ordered by the handle fields.
        If a handle is not available in the active topology, construction fails.
        Each output preserves its handle's arrival
        order independently. Equal output offsets do not guarantee RF-time alignment.

        Timestamp Tags - rf_timestamp is attached to the first sample of each
        received packet on its own output. Gaps are reported as timestamp
        discontinuities; missing samples are not inserted. Continuity tracking
        resets on start, which retains the existing device timestamp reset.

        RX Calibration - Set the mode to manual or auto, if manual the block needs 
        to set run_cal to 1. Manual calibration runs once on each selected handle.
        The requested calibration types are restricted to each handle's supported
        subset; unrequested types are never enabled. A request with no supported
        types reports an error.

        Configuration messages - The block also can receive the "lo_freq", "rate",
        "bandwidth", and "gain" messages to modify those parameters. The
        lo_freq_rxa1, lo_freq_rxa2, lo_freq_rxb1, lo_freq_rxb2, lo_freq_rxc1,
        and lo_freq_rxd1 keys tune individual selected handles.

        Transceive - The block can be used with the TX block to allow Transceive mode.  
        There will be a warning when the second block initializes.

    Parameters:
         Card: The card number of the Sidekiq card.

         Topology: -1 leaves the current topology unchanged. On cards that support topologies,
         0 and other valid IDs apply that topology. Ignored on non-topology capable cards.

         Handle: Select up to four distinct RX handles; None disables an optional handle.

         Sample_rate: The sample rate of the card.

         Bandwidth: The bandwidth of the card.

         Frequency: The LO frequency of each selected handle.

         Gain Mode: Auto or Manual, if Manual the gain_index must be set.

         Gain Index: This is the gain index for the specific card.  Each hardware 
         platform has a different valid range.

         Calibration Mode: Auto or Manual, if Manual the run_cal is used to manually 
         run the calibration.

         run_cal: If in Manual Calibration Mode, a 1 for this parameter will force calibration to run.



#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
